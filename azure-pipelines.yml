trigger:
  branches:
    include:
      - '*'

pool:
  vmImage: ubuntu-latest

steps:

# Checkout source from GitHub
- checkout: self
  persistCredentials: true
  fetchDepth: 0

# Git Config
- script: |

    echo "===================================="
    echo "Git Config"
    echo "===================================="

    git config --global user.email "devops@company.com"
    git config --global user.name "Azure DevOps Pipeline"

    echo ""
    echo "Current Branch"
    git branch

    echo ""
    echo "Remote List"
    git remote -v

  displayName: "Git Config"

# Sync GitHub To Azure Repo
- script: |

    echo "===================================="
    echo "Sync GitHub To Azure Repo"
    echo "===================================="

    echo ""
    echo "Remove old remote"
    git remote remove azure || true

    echo ""
    echo "Add Azure Remote"
    git remote add azure https://$(AZURE_PAT)@dev.azure.com/Digital-Product-Development/DPD_FromGitHub/_git/test-sync-azure-devops

    echo ""
    echo "Verify Remote"
    git remote -v

    echo ""
    echo "Push All Branches"
    git push azure --all --force

    echo ""
    echo "Push Tags"
    git push azure --tags --force

    echo ""
    echo "===================================="
    echo "Sync Completed"
    echo "===================================="

  displayName: "Sync GitHub To Azure Repo"

