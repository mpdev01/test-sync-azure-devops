trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

steps:

# Checkout source
- checkout: self
  persistCredentials: true
  fetchDepth: 0

# Git Config
- script: |

    echo "===================================="
    echo "Git Config"
    echo "===================================="

    git config --global user.email "devops@company.com"
    git config --global user.name "Azure DevOps Pipeline"

    echo ""
    echo "Current Branch"
    git branch -a

    echo ""
    echo "Checkout main branch"
    git checkout main

  displayName: "Git Config"

# Sync To Azure Repo
- script: |

    echo "===================================="
    echo "Sync GitHub To Azure Repo"
    echo "===================================="

    echo ""
    echo "Remove old remote"
    git remote remove azure || true

    echo ""
    echo "Add Azure Remote"
    git remote add azure https://$(AZURE_PAT)@dev.azure.com/Digital-Product-Development/DPD_FromGitHub/_git/test_github_pipeline

    echo ""
    echo "Verify Remote"
    git remote -v

    echo ""
    echo "Push main branch"
    git push azure main --force

    echo ""
    echo "Push tags"
    git push azure --tags --force

    echo ""
    echo "===================================="
    echo "Sync Completed"
    echo "===================================="

  displayName: "Sync GitHub To Azure Repo"

